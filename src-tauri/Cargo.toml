[package]
name = "flowith"
version = "0.1.0"
description = "flowith - Campus life efficiency companion"
authors = ["you"]
license = "MIT"
edition = "2021"

[lib]
name = "flowith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
chrono = "0.4"
dirs = "5"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.1"
tauri-plugin-window-state = "2.2.2"
